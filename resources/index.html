<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'">
  <title>OCRat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="window">
    <header>
      <div class="brand">
        <img class="logo" src="icons/appIcon.png" width="44" height="44" alt="">
        <h1>OCRat</h1>
      </div>
      <button type="button" id="theme" aria-pressed="false" aria-label="Светлая тема">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.4"></circle>
          <path d="M12 3.2v2M12 18.8v2M3.2 12h2M18.8 12h2M5.8 5.8l1.4 1.4M16.8 16.8l1.4 1.4M18.2 5.8l-1.4 1.4M7.2 16.8l-1.4 1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.6 3.6a7.8 7.8 0 1 0 4.6 10.2A6.3 6.3 0 0 1 15.6 3.6z"></path>
        </svg>
      </button>
    </header>
    <main>
      <p id="error" role="alert"></p>
      <div id="drop">
        <div id="placeholder">
          <svg class="doc-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M19 12.5h13.2a2.2 2.2 0 0 1 2.2 2.2V31"></path>
            <path d="M14.5 17.5h16.2a2.3 2.3 0 0 1 2.3 2.3v15.4a2.3 2.3 0 0 1-2.3 2.3H14.5a2.3 2.3 0 0 1-2.3-2.3V19.8a2.3 2.3 0 0 1 2.3-2.3z"></path>
          </svg>
          <p class="drop-title">Перетащите файлы сюда</p>
          <p class="drop-sub">или выберите на компьютере</p>
        </div>
        <img id="preview" alt="" hidden>
        <button type="button" id="choose" class="primary">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.8 8.2V7.1A1.6 1.6 0 0 1 5.4 5.5h3.7l1.7 1.8h7.6a1.6 1.6 0 0 1 1.6 1.6v7.6a1.6 1.6 0 0 1-1.6 1.6H5.4a1.6 1.6 0 0 1-1.6-1.6V8.2z"></path>
          </svg>
          Выбрать файлы…
        </button>
      </div>
      <div class="row">
        <button type="button" id="recognize" class="primary" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 4.8H5.6A1.6 1.6 0 0 0 4 6.4V8.8M16 4.8h2.4A1.6 1.6 0 0 1 20 6.4V8.8M8 19.2H5.6A1.6 1.6 0 0 1 4 17.6V15.2M16 19.2h2.4a1.6 1.6 0 0 0 1.6-1.6V15.2"></path>
          </svg>
          Распознать
        </button>
      </div>
      <textarea id="result" spellcheck="false" aria-label="Распознанный текст"></textarea>
      <div class="row">
        <button type="button" id="copy" class="secondary" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8.2" y="8.2" width="10.2" height="10.2" rx="2"></rect>
            <path d="M6.4 15.2h-.6A1.6 1.6 0 0 1 4.2 13.6V6.2A1.6 1.6 0 0 1 5.8 4.6h7.4a1.6 1.6 0 0 1 1.6 1.6V7"></path>
          </svg>
          Копировать
        </button>
      </div>
    </main>
  </div>
  <script src="js/neutralino.js"></script>
  <script src="js/main.js" type="module"></script>
</body>
</html>
